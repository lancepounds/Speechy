<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speechy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* ================= Luna (Windows XP style) ================= */
  :root{
    --ink:#000000;
    --ink-soft:#444444;
    --face:#ECE9D8;           /* XP dialog beige */
    --face-dk:#D6D2C2;
    --edge:#003C74;           /* XP button border */
    --xpblue:#0A246A;
    --title:linear-gradient(180deg,#0997FF 0%,#0053EE 8%,#0050EE 40%,#0066FF 88%,#0055E5 94%,#0036C4 100%);
    --frame:#0831D9;
    --hot:#F8B330;            /* orange hover ring */
    --hot-in:#FFE7A2;
    --signal:#316AC5;
    --c-now:#1F5FA8;
    --c-people:#6A3D95;
    --c-work:#0E7B72;
    --c-church:#3F7A22;
    --c-around:#9A5B06;
    --c-recent:#A32C24;
    --c-joke:#B07206;
    --radius:3px;
    --font:Tahoma,"Atkinson Hyperlegible","Segoe UI",Verdana,ui-sans-serif,sans-serif;
    --titlefont:"Trebuchet MS",Tahoma,"Atkinson Hyperlegible",sans-serif;
    --btn:linear-gradient(180deg,#FFFFFF 0%,#F4F3EE 40%,#ECEBE6 85%,#D6D0C5 100%);
    --btnpress:linear-gradient(180deg,#CDCAC3 0%,#E3E3DB 20%,#E5E4DE 80%,#F2F2F1 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;
    overscroll-behavior:none;
    background:var(--face);
  }
  [hidden]{display:none !important}
  .sheet-inner > textarea,.sheet-inner > select,.sheet-inner > input{width:calc(100% - 28px)}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  :focus-visible{outline:1px dotted #000;outline-offset:-4px}

  /* ================= the app ================= */
  .window{
    display:flex;flex-direction:column;height:100vh;height:100dvh;
    background:var(--face);overflow:hidden;
  }

  /* ---- menu bar ---- */
  .toolbar{
    display:flex;align-items:center;gap:0;padding:2px 4px;background:var(--face);
    padding-top:calc(2px + env(safe-area-inset-top));flex-wrap:wrap;
  }
  .searchbox{margin-left:auto;width:150px;flex:0 1 auto;padding:1px 2px}
  .searchbox input{
    width:100%;height:24px;padding:0 6px;font-family:inherit;font-size:13px;
    background:#fff;border:1px solid #7F9DB9;border-radius:0;color:#000;
  }
  @media (max-width:420px){ .searchbox{width:100%;margin:2px 0 2px} }
  .tbtn{padding:4px 9px;font-size:13px;color:#000;border:1px solid transparent}
  .tbtn:hover{background:#316AC5;color:#fff}
  .tbtn[aria-pressed="true"]{
    background:#FFF;border-color:#ACA899 #fff #fff #ACA899;font-weight:bold;
  }
  .tsep{width:1px;height:16px;background:var(--face-dk);border-right:1px solid #fff;margin:0 3px}

  /* ---- panes ---- */
  .frame{flex:1;display:flex;min-height:0;background:#fff;border-top:1px solid #ACA899}
  .navpane{display:none}
  @media (min-width:980px){
    .navpane{
      display:block;width:200px;flex:0 0 200px;overflow-y:auto;padding:8px 6px;
      background:var(--face);border-right:1px solid #ACA899;
    }
    .navitem{
      display:flex;align-items:center;gap:8px;width:100%;text-align:left;
      padding:7px 8px;font-size:13px;color:#000;
    }
    .navitem:hover{background:#316AC5;color:#fff}
    .navitem[aria-selected="true"]{font-weight:bold;background:#fff;box-shadow:inset 3px 0 0 var(--cat)}
    .navitem .dot{width:10px;height:10px;border-radius:2px;background:var(--cat);flex:0 0 auto;
                  border:1px solid rgba(0,0,0,.25)}
    .rail{display:none !important}
  }
  .content{flex:1;min-width:0;overflow-y:auto;background:#fff;position:relative}

  /* ---- XP scrollbars ---- */
  .content::-webkit-scrollbar,.navpane::-webkit-scrollbar,.sheet-inner::-webkit-scrollbar{width:17px}
  .content::-webkit-scrollbar-track,.navpane::-webkit-scrollbar-track,.sheet-inner::-webkit-scrollbar-track{
    background:#F4F3EE;border-left:1px solid #EDEBE4;
  }
  .content::-webkit-scrollbar-thumb,.navpane::-webkit-scrollbar-thumb,.sheet-inner::-webkit-scrollbar-thumb{
    border:1px solid #fff;border-radius:3px;
    background:linear-gradient(90deg,#C9D8FC 0%,#BACCF7 50%,#B4C8F6 100%);
    box-shadow:inset 0 0 0 1px #9DB5EE;
  }

  /* ---- the speak panel ---- */
  .stage{padding:12px;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #D6D2C2}
  .said{padding:0}
  .said p{
    margin:0 0 10px;font-size:25px;line-height:1.22;font-weight:bold;min-height:1.22em;word-break:break-word;
    background:#fff;border:1px solid #7F9DB9;padding:10px 12px;
  }
  .said p.empty{color:#6D6D6D;font-weight:normal;font-size:19px}
  .modebar{display:flex;gap:0;margin-bottom:10px}
  .mode{
    flex:1;padding:7px 8px;font-size:13px;color:#000;
    background:linear-gradient(180deg,#FFFFFF,#ECEBE6 90%,#D6D0C5);
    border:1px solid #919B9C;border-bottom-color:#919B9C;
  }
  .mode + .mode{border-left:none}
  .mode[aria-pressed="true"]{
    background:#fff;font-weight:bold;box-shadow:inset 0 3px 0 #FFC83C;border-bottom-color:#fff;
  }
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .actions.three{grid-template-columns:1.1fr 1.3fr .7fr}
  .act,.dock button,.sheet-actions button,.tile,.opt,.addtile{
    background:var(--btn);border:1px solid var(--edge);border-radius:3px;color:#000;
    box-shadow:inset -1px -1px 0 rgba(0,0,0,.08);
  }
  .act{padding:12px 9px;font-size:17px;font-weight:bold}
  .act#sayAgain,.act#buildSay{box-shadow:inset 0 0 0 2px #98B8EA,inset -1px -1px 0 rgba(0,0,0,.08)}
  .act:hover:not(:disabled),.dock button:hover,.sheet-actions button:hover,.tile:hover,.opt:hover{
    box-shadow:inset 0 0 0 2px var(--hot),inset 0 0 0 3px var(--hot-in);
  }
  .act:disabled{color:#ACA899;border-color:#C9C7BA;background:#F5F4EA;box-shadow:none}
  .act:active:not(:disabled),.tile:active,.dock button:active,.sheet-actions button:active,.opt:active{
    background:var(--btnpress);box-shadow:none;
  }

  /* ---- tabs (mobile) ---- */
  .rail{display:flex;gap:1px;overflow-x:auto;padding:4px 12px 0;scrollbar-width:none;
        position:sticky;top:var(--stageH,150px);z-index:19;background:#fff;
        border-bottom:1px solid #919B9C}
  .rail::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;padding:6px 11px;font-size:13px;color:#000;flex:0 0 auto;
    background:linear-gradient(180deg,#FFFFFF,#ECEBE6 90%,#D6D0C5);
    border:1px solid #919B9C;border-bottom:none;border-radius:3px 3px 0 0;margin-top:2px;
  }
  .chip[aria-selected="true"]{
    background:#fff;font-weight:bold;margin-top:0;padding-bottom:8px;
    box-shadow:inset 0 3px 0 #FFC83C;margin-bottom:-1px;
  }

  /* ---- tiles ---- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
  .tile{
    border-left:6px solid var(--cat);padding:13px 12px;text-align:left;font-size:16px;font-weight:bold;
    line-height:1.25;min-height:84px;display:flex;align-items:flex-start;position:relative;
  }
  .tile.wide{grid-column:1 / -1;min-height:0;font-size:17px}
  .grid.compact{grid-template-columns:repeat(3,1fr);gap:7px}
  .grid.compact .tile{min-height:56px;font-size:15px;padding:9px 6px;
                      align-items:center;justify-content:center;text-align:center;border-left-width:4px}
  .star-btn{
    position:absolute;
    top:6px;
    right:7px;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:4px;
    font-size:22px;
    line-height:1;
    color:#B07206;
    background:rgba(255,255,255,.92);
    border:1px solid #B9B4A5;
    box-shadow:0 1px 2px rgba(0,0,0,.12);
  }
  .star-btn:hover{
    box-shadow:inset 0 0 0 2px var(--hot),inset 0 0 0 3px var(--hot-in);
  }
  [data-theme="dark"] .star-btn{
    background:#2E2E2E;
    border-color:#555;
    color:#FFD65A;
  }

  .tile .del{
    position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:3px;
    background:radial-gradient(circle at 90% 90%,#CC4600 0%,#DC6527 55%,#E5936C 80%,#F1BDA5 100%);
    color:#fff;font-size:17px;font-weight:bold;line-height:23px;text-align:center;border:1px solid #fff;
    box-shadow:0 0 0 1px #8C2A00;
  }
  .tile.random{
    grid-column:1 / -1;border-left-width:1px;min-height:0;padding:12px;justify-content:center;
    text-align:center;font-size:17px;color:#fff;text-shadow:1px 1px 1px rgba(0,0,0,.5);
    background:linear-gradient(180deg,#388E38 0%,#5DB45D 10%,#41A541 30%,#3C9D3C 60%,#2E7D2E 100%);
    border-color:#1F5F1F;
  }
  .addtile{grid-column:1 / -1;padding:12px;font-size:14px;border-style:dashed}
  .empty-note{grid-column:1 / -1;padding:26px 6px;color:#444;font-size:15px}
  .addon-note{grid-column:1 / -1;color:#444;font-size:13px;padding:2px 2px 6px}
  .group-head{
    grid-column:1 / -1;font-size:13px;font-weight:bold;color:#215DC6;
    padding:12px 2px 4px;margin-bottom:2px;border-bottom:1px solid;
    border-image:linear-gradient(90deg,#215DC6,transparent) 1;
  }

  /* ---- command area + status bar ---- */
  .dock{display:flex;gap:7px;padding:7px 12px;background:var(--face);border-top:1px solid #ACA899}
  .dock button{flex:1;padding:10px 8px;font-size:15px;font-weight:bold}
  .dock button.card{flex:0 0 auto;padding:10px 18px}

  /* ---- overlays: readability first ---- */
  .overlay{position:fixed;inset:0;z-index:60;background:#FFFFFF;display:none;flex-direction:column;
           padding:22px;border-top:6px solid #0053EE}
  .overlay.open{display:flex}
  .overlay .fit{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}
  .overlay .fit span{font-weight:700;line-height:1.12;word-break:break-word;color:#000}
  .overlay .hint{text-align:center;color:#444;font-size:15px;padding-top:10px}
  .card-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .card-body p{margin:0;font-size:27px;font-weight:bold;line-height:1.3;color:#000;white-space:pre-line}
  .card-body p.small{font-size:18px;font-weight:normal;color:#444}

  /* ---- dialogs ---- */
  .sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.25);display:none;
         align-items:center;justify-content:center;padding:10px}
  .sheet.open{display:flex}
  .sheet-inner{
    width:100%;max-width:560px;padding:0 0 0;max-height:90vh;overflow:auto;background:var(--face);
    border:3px solid var(--frame);border-top:none;border-radius:8px 8px 0 0;
    box-shadow:3px 4px 16px rgba(0,0,0,.5);
  }
  .sheet h2{
    margin:0;padding:6px 10px;font:bold 15px/1.3 var(--titlefont);color:#fff;
    background:var(--title);text-shadow:1px 1px 0 #0A1883;position:sticky;top:0;z-index:1;
  }
  .sheet-inner > *:not(h2):not(.sheet-actions){margin-left:14px;margin-right:14px}
  .sheet-inner > textarea:first-of-type{margin-top:14px}
  label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px;color:#000}
  textarea,select,input[type=text]{
    width:100%;font-family:inherit;font-size:16px;padding:6px;border-radius:0;
    border:1px solid #7F9DB9;background:#fff;color:#000;
  }
  textarea{min-height:90px;resize:vertical}
  input[type=range]{width:100%;accent-color:#316AC5}
  .sheet-inner > input[type=range]{width:calc(100% - 28px)}
  .sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 0;padding:10px 14px 12px}
  .sheet-actions button{padding:9px;font-size:14px}
  .sheet-actions button.primary{font-weight:bold;box-shadow:inset 0 0 0 2px #98B8EA}
  .note{font-size:12px;color:#444;margin:10px 0 14px;line-height:1.45}
  .opt{
    display:block;width:100%;text-align:left;padding:13px;font-size:17px;font-weight:bold;
    line-height:1.3;margin-bottom:8px;border-left:6px solid var(--signal);
  }
  #optList{margin-top:14px}
  .thinking{padding:20px 4px;font-size:15px;color:#444}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  @media (min-width:640px){
    .grid{grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
    .grid.compact{grid-template-columns:repeat(5,1fr)}
    .said p{font-size:30px}
    .tile{font-size:17px;min-height:98px}
    .grid.compact .tile{font-size:16px;min-height:64px}
  }
  @media (min-width:980px){
    .grid{grid-template-columns:repeat(4,1fr)}
    .grid.compact{grid-template-columns:repeat(6,1fr)}
    .said p{font-size:34px}
    .tile{font-size:18px;min-height:106px}
    .act{font-size:19px;padding:14px 10px}
  }
  @media (min-width:1300px){
    .grid{grid-template-columns:repeat(5,1fr)}
    .grid.compact{grid-template-columns:repeat(8,1fr)}
  }

  /* ================= dark: a charcoal "night" Luna ================= */
  [data-theme="dark"]{
    --ink:#EDEDED;
    --face:#2B2B2B;
    --face-dk:#1C1C1C;
    --edge:#0B0B0B;
    --title:linear-gradient(180deg,#5A5A5A 0%,#2E2E2E 8%,#1E1E1E 50%,#141414 92%,#000 100%);
    --frame:#1A1A1A;
    --btn:linear-gradient(180deg,#4A4A4A 0%,#3C3C3C 45%,#333 85%,#262626 100%);
    --btnpress:linear-gradient(180deg,#1C1C1C,#2A2A2A);
  }
  [data-theme="dark"] body{color:#EDEDED;background:var(--face)}
  [data-theme="dark"] .sheet h2{text-shadow:1px 1px 0 #000}
  [data-theme="dark"] .searchbox input,
  [data-theme="dark"] textarea,[data-theme="dark"] select,[data-theme="dark"] input[type=text]{
    background:#111;border-color:#555;color:#EDEDED;
  }
  [data-theme="dark"] .tbtn{color:#EDEDED}
  [data-theme="dark"] .tbtn[aria-pressed="true"]{background:#111;border-color:#000 #555 #555 #000}
  [data-theme="dark"] .tsep{background:#111;border-color:#444}
  [data-theme="dark"] .frame,[data-theme="dark"] .content,[data-theme="dark"] .stage,
  [data-theme="dark"] .rail{background:#1B1B1B;border-color:#444}
  [data-theme="dark"] .navpane{background:var(--face);border-color:#111}
  [data-theme="dark"] .stage{border-color:#333}
  [data-theme="dark"] .navitem{color:#EDEDED}
  [data-theme="dark"] .navitem[aria-selected="true"]{color:#fff;background:#1B1B1B}
  [data-theme="dark"] .content::-webkit-scrollbar-track,
  [data-theme="dark"] .navpane::-webkit-scrollbar-track,
  [data-theme="dark"] .sheet-inner::-webkit-scrollbar-track{background:#222;border-color:#222}
  [data-theme="dark"] .content::-webkit-scrollbar-thumb,
  [data-theme="dark"] .navpane::-webkit-scrollbar-thumb,
  [data-theme="dark"] .sheet-inner::-webkit-scrollbar-thumb{
    border-color:#1B1B1B;background:linear-gradient(90deg,#555,#4A4A4A);box-shadow:inset 0 0 0 1px #666;
  }
  [data-theme="dark"] .said p{background:#111;border-color:#555;color:#F5F5F5}
  [data-theme="dark"] .said p.empty{color:#9A9A9A}
  [data-theme="dark"] .mode,[data-theme="dark"] .chip{background:var(--btn);border-color:#555;color:#EDEDED}
  [data-theme="dark"] .mode[aria-pressed="true"],[data-theme="dark"] .chip[aria-selected="true"]{background:#1B1B1B}
  [data-theme="dark"] .act,[data-theme="dark"] .dock button,[data-theme="dark"] .sheet-actions button,
  [data-theme="dark"] .tile,[data-theme="dark"] .opt,[data-theme="dark"] .addtile{color:#F2F2F2}
  [data-theme="dark"] .act#sayAgain,[data-theme="dark"] .act#buildSay,
  [data-theme="dark"] .sheet-actions button.primary{box-shadow:inset 0 0 0 2px #3F6FC0}
  [data-theme="dark"] .act:disabled{background:#262626;color:#666;border-color:#3A3A3A;box-shadow:none}
  [data-theme="dark"] .empty-note,[data-theme="dark"] .addon-note,[data-theme="dark"] .note,
  [data-theme="dark"] .thinking{color:#AAA}
  [data-theme="dark"] .group-head{color:#8DB2FF;border-image:linear-gradient(90deg,#8DB2FF,transparent) 1}
  [data-theme="dark"] .dock{border-color:#111}
  [data-theme="dark"] label{color:#DDD}
  [data-theme="dark"] .overlay{background:#0D0D0D}
  [data-theme="dark"] .overlay .fit span,[data-theme="dark"] .card-body p{color:#F5F5F5}
  [data-theme="dark"] .overlay .hint,[data-theme="dark"] .card-body p.small{color:#AAA}

  /* ================= phrase-book nested buttons ================= */
  .grid.phrasebook{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
    padding:16px;
    align-items:stretch;
  }
  .book-button{
    min-height:112px;
    padding:16px 14px;
    text-align:center;
    font-size:16px;
    font-weight:bold;
    line-height:1.3;
    white-space:normal;
    overflow-wrap:anywhere;
    background:var(--btn);
    border:1px solid var(--edge);
    border-left:7px solid var(--cat);
    border-radius:7px;
    box-shadow:inset -1px -1px 0 rgba(0,0,0,.08),0 3px 7px rgba(0,0,0,.10);
  }
  .book-button:hover{
    box-shadow:inset 0 0 0 2px var(--hot),inset 0 0 0 3px var(--hot-in),0 4px 10px rgba(0,0,0,.14);
  }

  .nested-wrap{
    grid-column:1/-1;
    width:100%;
    padding:4px 0 10px;
  }
  .nested-tab{
    width:min(760px,100%);
    margin:0 auto;
    padding:16px;
    background:var(--face);
    border:1px solid #ACA899;
    border-radius:8px;
    box-shadow:0 5px 16px rgba(0,0,0,.14);
    animation:nested-panel-in .22s ease-out both;
  }
  .nested-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .nested-center{
    flex:1;
    min-height:74px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    line-height:1.25;
    background:var(--btn);
    border:3px solid var(--cat);
    border-radius:7px;
    box-shadow:inset 0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.15);
    animation:center-pop .24s cubic-bezier(.2,.9,.2,1) both;
  }
  .nested-back{
    flex:0 0 auto;
    min-width:96px;
    min-height:54px;
    padding:10px 13px;
    font-size:14px;
    font-weight:bold;
    background:var(--btn);
    border:1px solid var(--edge);
    border-radius:5px;
  }
  .nested-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
  }
  .nested-phrase{
    min-height:104px;
    padding:15px 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:15px;
    font-weight:bold;
    line-height:1.3;
    white-space:normal;
    overflow-wrap:anywhere;
    background:var(--btn);
    border:1px solid var(--edge);
    border-left:7px solid var(--cat);
    border-radius:7px;
    opacity:0;
    transform:translateY(14px) scale(.96);
    animation:nested-child-pop .3s cubic-bezier(.18,.9,.25,1.08) forwards;
    animation-delay:calc(45ms + (var(--i) * 55ms));
  }
  .nested-phrase:hover,.nested-center:hover,.nested-back:hover{
    box-shadow:inset 0 0 0 2px var(--hot),inset 0 0 0 3px var(--hot-in),0 3px 8px rgba(0,0,0,.14);
  }
  .nested-controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:14px;
  }
  .nested-controls button{
    min-width:120px;
    min-height:46px;
    padding:9px 14px;
    font-size:14px;
    font-weight:bold;
    background:var(--btn);
    border:1px solid var(--edge);
    border-radius:4px;
  }
  @keyframes nested-panel-in{
    from{opacity:0;transform:translateY(8px) scale(.985)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes center-pop{
    0%{opacity:0;transform:scale(.92)}
    70%{opacity:1;transform:scale(1.035)}
    100%{opacity:1;transform:scale(1)}
  }
  @keyframes nested-child-pop{
    from{opacity:0;transform:translateY(14px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  @media (min-width:700px){
    .grid.phrasebook{grid-template-columns:repeat(3,minmax(0,1fr))}
    .nested-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

<body>
<div class="window" id="app">

  <div class="toolbar">
    <button class="tbtn" id="editBtn" aria-pressed="false">Organize</button>
    <span class="tsep"></span>
    <button class="tbtn" id="styleBtn" aria-pressed="false">Old style</button>
    <span class="tsep"></span>
    <button class="tbtn" id="setBtn">Voice</button>
    <span class="tsep"></span>
    <button class="tbtn" id="fsBtn">Full screen</button>
    <span class="tsep"></span>
    <button class="tbtn" id="themeBtn">Dark theme</button>
    <div class="searchbox">
      <input type="text" id="search" placeholder="Search" autocomplete="off" aria-label="Search all phrases">
    </div>
  </div>

  <div class="frame">
    <div class="navpane">
      <div id="navlist"></div>
    </div>

    <div class="content">
      <div class="stage" id="stage">
        <div class="said">
          <div class="modebar" role="group" aria-label="What tapping a tile does">
            <button id="modeSpeak" class="mode" aria-pressed="true">Tap speaks</button>
            <button id="modeBuild" class="mode" aria-pressed="false">Tap builds</button>
          </div>
          <button id="styleSwitchMain" class="act" style="width:100%;margin:0 0 10px;padding:9px 10px;font-size:14px">Switch to Old Style</button>
          <p id="saidText" class="empty">Tap a phrase and it speaks.</p>
          <div class="actions" id="speakActions">
            <button class="act" id="sayAgain" disabled>Say again</button>
            <button class="act secondary" id="showBig" disabled>Show big</button>
          </div>
          <div class="actions three" id="buildActions" hidden>
            <button class="act" id="buildSay" disabled>Say it</button>
            <button class="act secondary" id="buildExpand" disabled>Make a sentence</button>
            <button class="act ghost" id="buildClear" disabled>Clear</button>
          </div>
        </div>
      </div>

      <div class="rail" id="rail" role="tablist"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="dock">
    <button id="typeBtn">Type something</button>
    <button class="card" id="cardBtn">Card</button>
  </div>

</div>

<!-- show-big overlay -->
<div class="overlay" id="bigOverlay" role="dialog" aria-label="Displayed message">
  <div class="fit"><span id="bigText"></span></div>
  <div class="hint">Tap anywhere to close</div>
</div>

<!-- explainer card overlay -->
<div class="overlay" id="cardOverlay" role="dialog" aria-label="Explainer card">
  <div class="card-body">
    <p id="cardText"></p>
    <p class="small">Tap anywhere to close. Hold Edit on the board to change this.</p>
  </div>
</div>

<!-- sentence options sheet -->
<div class="sheet" id="optSheet" role="dialog" aria-label="Sentence options">
  <div class="sheet-inner">
    <h2>Pick a sentence</h2>
    <div id="optList"></div>
    <div class="sheet-actions">
      <button id="optCancel">Back</button>
      <button class="primary" id="optAgain">Try again</button>
    </div>
    <p class="note" id="optNote"></p>
  </div>
</div>

<!-- type sheet -->
<div class="sheet" id="typeSheet" role="dialog" aria-label="Type a message">
  <div class="sheet-inner">
    <h2>Type a message</h2>
    <textarea id="typeInput" placeholder="Write what you want to say" autocomplete="off"></textarea>
    <div class="sheet-actions">
      <button id="typeCancel">Cancel</button>
      <button class="primary" id="typeSpeak">Say it</button>
    </div>
    <div class="sheet-actions" style="grid-template-columns:1fr 1fr;margin-top:8px">
      <button id="typeExpand">Make a sentence</button>
      <button id="typeShow">Show it big</button>
    </div>
  </div>
</div>

<!-- add phrase sheet -->
<div class="sheet" id="addSheet" role="dialog" aria-label="Add a phrase">
  <div class="sheet-inner">
    <h2 id="addTitle">Add a phrase</h2>
    <textarea id="addInput" placeholder="Write it out the way you'd say it, as a full sentence"></textarea>
    <div class="sheet-actions">
      <button id="addCancel">Cancel</button>
      <button class="primary" id="addSave">Save</button>
    </div>
  </div>
</div>

<!-- settings sheet -->
<div class="sheet" id="setSheet" role="dialog" aria-label="Voice settings">
  <div class="sheet-inner">
    <h2>Voice</h2>
    <label for="voiceSel">Which voice</label>
    <select id="voiceSel"></select>
    <label for="rate">Speed</label>
    <input type="range" id="rate" min="0.6" max="1.3" step="0.05">
    <label for="cardEdit">Card for handing to someone</label>
    <textarea id="cardEdit"></textarea>
    <div class="sheet-actions">
      <button id="setClose">Done</button>
      <button class="primary" id="setTest">Test the voice</button>
    </div>
    <p class="note" id="voiceNote"></p>
    <div class="sheet-actions" style="grid-template-columns:1fr;margin-top:10px">
      <button id="resetBtn">Reset board to the original phrases</button>
    </div>
  </div>
</div>

const CARD_OLD =
  "My speech is affected by an injury.\n\nI understand you completely — please talk to me normally, and give me a moment to answer.\n\nThank you.";
const CARD_DEFAULT =
  "My speech is affected by cerebral palsy.\n\nI understand you completely. Please talk to me normally, and give me a moment to answer.\n\nThank you.";
const RETIRED_PHRASES = ["I had a brain injury last year, and my speech is still coming back."];

let custom = {};      // {catId: [phrases]}
let removed = {};     // {catId: [phrases removed from BASE]}
let counts  = {};     // {phrase: n}
let starred = [];      // favorite phrases
let settings = {rate:0.95, voiceURI:null, card:CARD_DEFAULT, theme:'auto', uiStyle:'nested'};
let activeCat = CATS.some(c=>c.id===location.hash.slice(1)) ? location.hash.slice(1) : 'now';
let radialPage = {};
let activeSubtopic = {};
let editing = false;
let lastSaid = '';
let buffer = '';
let mode = 'speak';
let addTarget = null;

/* ------------------------------------------------------------- storage */
/* Works in three places: a published page (claude db, syncs across your
   devices), the chat preview (window.storage), or a plain saved file
   (localStorage). Falls back to memory-only rather than breaking. */
let backend = 'memory', dbDoc = null;

async function initBackend(){
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      const db = await window.claude.use('db');
      if(db){ dbDoc = db.doc('board/main'); backend = 'db'; return; }
    }
  }catch(e){}
  if(window.storage && window.storage.get){ backend = 'storage'; return; }
  try{
    localStorage.setItem('aac:probe','1'); localStorage.removeItem('aac:probe');
    backend = 'local';
  }catch(e){ backend = 'memory'; }
}

function apply(raw){
  if(!raw) return;
  custom = raw.custom || {}; removed = raw.removed || {};
  counts = raw.counts || {}; settings = Object.assign(settings, raw.settings || {});
  // the saved card still carries the old "injury" wording unless he edited it himself
  let changed = false;
  if(settings.card === CARD_OLD){ settings.card = CARD_DEFAULT; changed = true; }
  RETIRED_PHRASES.forEach(p=>{ if(counts[p] !== undefined){ delete counts[p]; changed = true; } });
  if(changed) save();
}

async function load(){
  try{
    if(backend === 'db'){
      const snap = await dbDoc.get();
      if(snap.exists) apply(snap.data());
    } else if(backend === 'storage'){
      const r = await window.storage.get('aac:board');
      if(r && r.value) apply(JSON.parse(r.value));
    } else if(backend === 'local'){
      const v = localStorage.getItem('aac:board');
      if(v) apply(JSON.parse(v));
    }
  }catch(e){ /* nothing saved yet, or storage unavailable — defaults stand */ }
}

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const payload = {custom, removed, counts, settings};
    try{
      if(backend === 'db') await dbDoc.set(payload);
      else if(backend === 'storage') await window.storage.set('aac:board', JSON.stringify(payload));
      else if(backend === 'local') localStorage.setItem('aac:board', JSON.stringify(payload));
    }catch(e){ console.error('Could not save', e); }
  }, 300);
}

/* --------------------------------------------------------------- speech */
let voices = [];
function loadVoices(){
  if(!window.speechSynthesis) return;
  voices = speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
  const sel = document.getElementById('voiceSel');
  sel.innerHTML = '';
  if(!voices.length){
    sel.innerHTML = '<option>Device default</option>';
  } else {
    voices.forEach(v=>{
      const o = document.createElement('option');
      o.value = v.voiceURI; o.textContent = v.name;
      if(v.voiceURI === settings.voiceURI) o.selected = true;
      sel.appendChild(o);
    });
  }
  document.getElementById('voiceNote').textContent = window.speechSynthesis
    ? 'If the room is loud, Show big works better than the voice.'
    : 'This device will not play a voice. Show big and the card still work.';
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text){
  if(!text) return;
  lastSaid = text;
  renderSaid();
  if(!window.speechSynthesis){ showBig(text); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = settings.rate;
    const v = voices.find(v=>v.voiceURI===settings.voiceURI);
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){ showBig(text); }
}

function bump(p){ counts[p] = (counts[p]||0)+1; save(); }

/* ---------------------------------------------------------------- render */
function phrasesFor(cat){
  if(cat === 'starred'){
    return starred.slice();
  }
  if(cat === 'recent'){
    return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,12);
  }
  const gone = removed[cat] || [];
  if(cat === 'offduty'){
    return JOKE_GROUPS.flatMap(g=>g.lines).filter(p=>!gone.includes(p)).concat(custom.offduty || []);
  }
  return (BASE[cat]||[]).filter(p=>!gone.includes(p)).concat(custom[cat]||[]);
}

function subtopicsFor(cat, list){
  const clean = (list||[]).filter(Boolean);
  if(!clean.length) return [];

  if(cat.id === 'quick'){
    const gs = [
      {name:'Yes / No', phrases:clean.filter(p=>/\b(yes|no|maybe|sure|okay|ok|not right now)\b/i.test(p))},
      {name:'Needs', phrases:clean.filter(p=>/need|want|please|help|moment|second|wait/i.test(p))},
      {name:'Other quick phrases', phrases:clean.filter(p=>!/\b(yes|no|maybe|sure|okay|ok|not right now)\b/i.test(p) && !/need|want|please|help|moment|second|wait/i.test(p))}
    ].filter(g=>g.phrases.length);
    if(gs.length>1) return gs;
  }

  if(cat.id === 'ask'){
    const gs = [
      {name:'People', phrases:clean.filter(p=>/who|name|you|your|they|them/i.test(p))},
      {name:'Details', phrases:clean.filter(p=>/what|where|when|which|how/i.test(p))},
      {name:'Follow-up', phrases:clean.filter(p=>/again|more|mean|clarify|repeat|tell me/i.test(p))}
    ].filter(g=>g.phrases.length);
    if(gs.length>1) return gs;
  }

  const targetGroups = Math.min(4, Math.max(2, Math.ceil(clean.length/5)));
  const size = Math.ceil(clean.length/targetGroups);
  const groups = [];
  for(let i=0;i<clean.length;i+=size){
    groups.push({
      name: cat.name + ' ' + (groups.length+1),
      phrases: clean.slice(i,i+size)
    });
  }
  return groups;
}

function renderSaid(){
  const el = document.getElementById('saidText');
  const build = mode === 'build';
  document.getElementById('speakActions').hidden = build;
  document.getElementById('buildActions').hidden = !build;
  document.getElementById('modeSpeak').setAttribute('aria-pressed', !build);
  document.getElementById('modeBuild').setAttribute('aria-pressed', build);

  const text = build ? buffer : lastSaid;
  if(text){ el.textContent = text; el.classList.remove('empty'); }
  else {
    el.textContent = build
      ? 'Tap words and phrases. They collect here.'
      : 'Tap a phrase and it speaks.';
    el.classList.add('empty');
  }
  document.getElementById('sayAgain').disabled = !lastSaid;
  document.getElementById('showBig').disabled  = !lastSaid;
  document.getElementById('buildSay').disabled    = !buffer;
  document.getElementById('buildExpand').disabled = !buffer;
  document.getElementById('buildClear').disabled  = !buffer;
  measure();
}

function addToBuffer(fragment, isAddon){
  const f = fragment.trim();
  if(!buffer){
    buffer = isAddon ? f.charAt(0).toUpperCase() + f.slice(1) : f;
    renderSaid();
    return;
  }
  if(isAddon){
    // attach to the end of what's there: "I'll have it to you." + "before Friday."
    // becomes "I'll have it to you before Friday."
    const ended = (buffer.match(/([.?!])\s*$/) || [])[1] || '';
    let joined = buffer.replace(/[.?!]\s*$/, '') + ' ' + f;
    if(ended === '?' && /\.$/.test(joined)) joined = joined.replace(/\.$/, '?');
    buffer = joined;
  } else if(/[.?!]\s*$/.test(buffer)){
    // two complete sentences stay two sentences
    buffer = buffer.replace(/\s*$/, '') + ' ' + f;
  } else {
    buffer = buffer + ' ' + f;
  }
  renderSaid();
}

function selectCat(c){
  activeCat = c.id;
  if(c.addon){
    if(mode !== 'build') mode = 'build';
    if(!buffer && lastSaid) buffer = lastSaid;
  }
  const q = document.getElementById('search');
  if(q) q.value = '';
  renderRail(); renderGrid(); renderSaid();
}

function renderRail(){
  const rail = document.getElementById('rail');
  const nav  = document.getElementById('navlist');
  rail.innerHTML = ''; if(nav) nav.innerHTML = '';
  CATS.forEach(c=>{
    if(nav){
      const n = document.createElement('button');
      n.className = 'navitem';
      n.setAttribute('aria-selected', c.id===activeCat);
      n.style.setProperty('--cat', c.color);
      const d = document.createElement('span'); d.className='dot';
      n.appendChild(d);
      n.appendChild(document.createTextNode(c.name));
      n.onclick = ()=> selectCat(c);
      nav.appendChild(n);
    }
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = c.name; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', c.id===activeCat);
    b.style.setProperty('--cat', c.color);
    b.onclick = ()=>{
      activeCat = c.id;
      if(c.addon){
        if(mode !== 'build') mode = 'build';
        if(!buffer && lastSaid) buffer = lastSaid;
      }
      renderRail(); renderGrid(); renderSaid();
    };
    rail.appendChild(b);
  });
}

function toggleStar(p){
  if(starred.includes(p)) starred = starred.filter(x=>x!==p);
  else starred = starred.concat([p]);
  save();
  renderGrid();
}
function isStarred(p){ return starred.includes(p); }

function makeTile(p, cat, noDel){
  const t = document.createElement('button');
  t.className = 'tile' + (!cat.compact && p.length > 62 ? ' wide' : '');
  t.style.setProperty('--cat', cat.color);
  t.textContent = p;
  t.onclick = ()=>{
    if(editing) return;
    if(mode === 'build'){ addToBuffer(p, !!cat.addon); }
    else { speak(p); bump(p); }
  };

  if(settings.uiStyle === 'classic' && !editing){
    const star = document.createElement('span');
    star.className = 'star-btn';
    star.textContent = isStarred(p) ? '★' : '☆';
    star.setAttribute('aria-label', isStarred(p) ? 'Unstar phrase' : 'Star phrase');
    star.title = isStarred(p) ? 'Unstar phrase' : 'Star phrase';
    star.onclick = (e)=>{
      e.stopPropagation();
      toggleStar(p);
    };
    t.appendChild(star);
  }

  if(editing && activeCat !== 'recent' && activeCat !== 'starred' && !noDel){
    const x = document.createElement('span');
    x.className='del'; x.textContent='×'; x.setAttribute('aria-label','Remove phrase');
    x.onclick = (e)=>{ e.stopPropagation(); removePhrase(activeCat, p); };
    t.appendChild(x);
  }
  return t;
}

function renderJokes(grid, cat){
  const warn = document.createElement('div');
  warn.className = 'addon-note';
  warn.textContent = 'Not for hearings. Probably not for church either.';
  grid.appendChild(warn);

  const rnd = document.createElement('button');
  rnd.className = 'tile random';
  rnd.textContent = 'Say a random one';
  rnd.onclick = ()=>{
    if(editing) return;
    const all = phrasesFor('offduty');
    if(!all.length) return;
    const p = all[Math.floor(Math.random()*all.length)];
    if(mode === 'build'){ addToBuffer(p, false); } else { speak(p); bump(p); }
  };
  grid.appendChild(rnd);

  const gone = removed.offduty || [];
  const groups = JOKE_GROUPS
    .map(g=>({name:g.name, lines:g.lines.filter(l=>!gone.includes(l))}))
    .filter(g=>g.lines.length);
  const mine = (custom.offduty || []).filter(Boolean);
  if(mine.length) groups.push({name:'Yours', lines:mine});

  groups.forEach(g=>{
    const h = document.createElement('div');
    h.className = 'group-head'; h.textContent = g.name;
    grid.appendChild(h);
    g.lines.forEach(p=> grid.appendChild(makeTile(p, cat)));
  });
}

function searchAll(q){
  const needle = q.toLowerCase();
  const out = [];
  CATS.forEach(c=>{
    if(c.id === 'recent') return;
    phrasesFor(c.id).forEach(p=>{
      if(p.toLowerCase().includes(needle)) out.push({p:p, cat:c});
    });
  });
  return out;
}

function setStatus(n, what){
  const d = document.getElementById('details');
  if(d) d.textContent = n + ' ' + (n === 1 ? 'item' : 'items') + (what ? '  |  ' + what : '');
}

function renderClassicGrid(grid, cat){
  grid.className = 'grid' + (cat.compact ? ' compact' : '');
  grid.style.setProperty('--cat', cat.color);
  const list = phrasesFor(activeCat);
  setStatus(list.length, cat.name);

  if(cat.addon){
    const n = document.createElement('div');
    n.className = 'addon-note';
    n.textContent = 'These attach to the end of the sentence in the bar above.';
    grid.appendChild(n);
  }

  if(cat.groups){
    const gone = removed[cat.id] || [];
    CLS_GROUPS.forEach(g=>{
      const lines = g.lines.filter(p=>!gone.includes(p));
      if(!lines.length) return;
      const h = document.createElement('div');
      h.className = 'group-head'; h.textContent = g.name;
      grid.appendChild(h);
      lines.forEach(p=>grid.appendChild(makeTile(p, cat)));
    });
    if((custom[cat.id]||[]).length){
      const h = document.createElement('div');
      h.className='group-head'; h.textContent='Your conference phrases'; grid.appendChild(h);
      custom[cat.id].forEach(p=>grid.appendChild(makeTile(p, cat)));
    }
  } else if(cat.jokes){
    renderJokes(grid, cat);
  } else {
    if(!list.length){
      const d = document.createElement('div');
      d.className = 'empty-note';
      d.textContent = activeCat==='recent'
        ? 'Phrases you use will collect here, most-used first.'
        : activeCat==='starred'
          ? 'Star phrases in Old Style and they will collect here.'
          : 'Nothing here yet. Use Organize to add a phrase.';
      grid.appendChild(d);
    }
    list.forEach(p=> grid.appendChild(makeTile(p, cat)));
  }
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const cat = CATS.find(c=>c.id===activeCat);
  const crumb = document.getElementById('crumb');
  const sq = document.getElementById('search');
  const query = sq ? sq.value.trim() : '';
  grid.innerHTML = '';

  if(query){
    grid.className = 'grid';
    const hits = searchAll(query);
    if(crumb) crumb.textContent = 'Search Results';
    if(!hits.length){
      const d = document.createElement('div');
      d.className = 'empty-note';
      d.textContent = 'No phrases match that search.';
      grid.appendChild(d);
    }
    hits.forEach(h=> grid.appendChild(makeTile(h.p, h.cat, true)));
    setStatus(hits.length, 'matching "' + query + '"');
    return;
  }

  if(settings.uiStyle === 'classic' && !editing){
    if(crumb) crumb.textContent = cat.name;
    renderClassicGrid(grid, cat);
    return;
  }

  if(editing){
    grid.className = 'grid' + (cat.compact ? ' compact' : '');
    grid.style.setProperty('--cat', cat.color);
    if(crumb) crumb.textContent = cat.name;
    const list = phrasesFor(activeCat);
    setStatus(list.length, cat.name);

    if(cat.groups){
      const gone = removed[cat.id] || [];
      CLS_GROUPS.forEach(g=>{
        const lines = g.lines.filter(p=>!gone.includes(p));
        if(!lines.length) return;
        const h = document.createElement('div');
        h.className = 'group-head'; h.textContent = g.name;
        grid.appendChild(h);
        lines.forEach(p=>grid.appendChild(makeTile(p, cat)));
      });
      if((custom[cat.id]||[]).length){
        const h = document.createElement('div');
        h.className='group-head'; h.textContent='Your conference phrases'; grid.appendChild(h);
        custom[cat.id].forEach(p=>grid.appendChild(makeTile(p, cat)));
      }
    } else if(cat.jokes){
      renderJokes(grid, cat);
    } else {
      list.forEach(p=> grid.appendChild(makeTile(p, cat)));
    }

    if(activeCat!=='recent'){
      const a=document.createElement('button');
      a.className='addtile'; a.textContent='+ Add a phrase to '+cat.name;
      a.onclick=()=>openAdd(activeCat);
      grid.appendChild(a);
    }
    return;
  }

  let list;
  if(cat.groups){
    const gone=removed[cat.id]||[];
    list=CLS_GROUPS.flatMap(g=>g.lines).filter(p=>!gone.includes(p)).concat(custom[cat.id]||[]);
  }else{
    list=phrasesFor(activeCat);
  }

  if(!list.length){
    grid.className='grid phrasebook';
    const d=document.createElement('div');
    d.className='empty-note';
    d.textContent=activeCat==='recent'
      ? 'Phrases you use will collect here, most-used first.'
      : 'Nothing here yet. Use Organize to add a phrase.';
    grid.appendChild(d);
    return;
  }

  const groups=subtopicsFor(cat,list);
  grid.style.setProperty('--cat',cat.color);

  const chosen=activeSubtopic[activeCat];
  if(chosen===undefined || chosen===null || !groups[chosen]){
    grid.className='grid phrasebook';
    if(crumb) crumb.textContent=cat.name;
    setStatus(groups.length,cat.name+' buttons');

    groups.forEach((g,i)=>{
      const b=document.createElement('button');
      b.className='book-button';
      b.style.setProperty('--cat',cat.color);
      b.textContent=g.name;
      b.setAttribute('aria-expanded','false');
      b.onclick=()=>{
        activeSubtopic[activeCat]=i;
        radialPage[activeCat+':'+i]=0;
        renderGrid();
      };
      grid.appendChild(b);
    });
    return;
  }

  const group=groups[chosen];
  const pageKey=activeCat+':'+chosen;
  const pageSize = window.innerWidth <= 620 ? 4 : 6;
  const pages=Math.max(1,Math.ceil(group.phrases.length/pageSize));
  let page=radialPage[pageKey]||0;
  if(page>=pages) page=pages-1;
  radialPage[pageKey]=page;
  const slice=group.phrases.slice(page*pageSize,page*pageSize+pageSize);

  grid.className='grid phrasebook';
  if(crumb) crumb.textContent=cat.name+' › '+group.name;
  setStatus(group.phrases.length,group.name);

  const wrap=document.createElement('div');
  wrap.className='nested-wrap';

  const tab=document.createElement('div');
  tab.className='nested-tab';
  tab.style.setProperty('--cat',cat.color);

  const head=document.createElement('div');
  head.className='nested-head';

  const center=document.createElement('button');
  center.className='nested-center';
  center.textContent=group.name;
  center.setAttribute('aria-expanded','true');
  center.onclick=()=>{
    activeSubtopic[activeCat]=null;
    renderGrid();
  };

  const back=document.createElement('button');
  back.className='nested-back';
  back.textContent='← Back';
  back.onclick=()=>{
    activeSubtopic[activeCat]=null;
    renderGrid();
  };

  head.append(center,back);
  tab.appendChild(head);

  const nestedGrid=document.createElement('div');
  nestedGrid.className='nested-grid';

  slice.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='nested-phrase';
    b.textContent=p;
    b.title=p;
    b.style.setProperty('--cat',cat.color);
    b.style.setProperty('--i',i);
    b.onclick=()=>{
      if(mode==='build'){ addToBuffer(p,!!cat.addon); }
      else{ speak(p); bump(p); }
    };
    nestedGrid.appendChild(b);
  });

  tab.appendChild(nestedGrid);

  if(pages>1){
    const controls=document.createElement('div');
    controls.className='nested-controls';

    const prev=document.createElement('button');
    prev.textContent='← Previous';
    prev.onclick=()=>{
      radialPage[pageKey]=(page-1+pages)%pages;
      renderGrid();
    };

    const next=document.createElement('button');
    next.textContent='Next →';
    next.onclick=()=>{
      radialPage[pageKey]=(page+1)%pages;
      renderGrid();
    };

    controls.append(prev,next);
    tab.appendChild(controls);
  }

  wrap.appendChild(tab);
  grid.appendChild(wrap);
}

function removePhrase(cat, p){
  if((custom[cat]||[]).includes(p)) custom[cat] = custom[cat].filter(x=>x!==p);
  else { removed[cat] = (removed[cat]||[]).concat([p]); }
  save(); renderGrid();
}

/* ------------------------------------------------------------- overlays */
function fitText(spanId, containerId, text){
  const span = document.getElementById(spanId);
  const box  = document.getElementById(containerId);
  span.textContent = text;
  const w = box.clientWidth || window.innerWidth;
  const h = box.clientHeight || window.innerHeight * 0.7;
  const len = Math.max(text.length, 4);
  let size = Math.sqrt((w*h*0.40)/len);
  size = Math.max(26, Math.min(150, size));
  span.style.fontSize = size + 'px';
}
function showBig(text){
  const o = document.getElementById('bigOverlay');
  o.classList.add('open');
  requestAnimationFrame(()=>fitText('bigText','bigOverlay',text));
}
document.getElementById('bigOverlay').onclick = e => e.currentTarget.classList.remove('open');
document.getElementById('cardOverlay').onclick = e => e.currentTarget.classList.remove('open');

/* ------------------------------------------------- sentence expansion */
const GUIDE =
  "You help a man named Lance speak. He is an attorney in Omaha; he has cerebral " +
  "palsy, which affects his speech, so he taps shorthand into a communication board and " +
  "you turn it into the full sentence he means to say out loud.\n" +
  "Rules: write in his first person. Natural spoken English, the way a capable " +
  "professional adult talks. Warm and direct, never flowery, never childlike, never " +
  "apologetic on his behalf. Keep it to what he actually indicated: do not invent " +
  "names, times, facts, or reasons he did not give. If the shorthand is already a " +
  "fine sentence, tighten it rather than padding it. No em dashes.\n" +
  "Give three versions: one plain and complete, one shorter and blunter, one more " +
  "formal for work or a hearing.\n" +
  "Return ONLY a JSON array of three strings, no other text.";

let sampleNS;
async function getSample(){
  if(sampleNS !== undefined) return sampleNS;
  sampleNS = null;
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      sampleNS = await window.claude.use('sample');
    }
  }catch(e){ sampleNS = null; }
  return sampleNS;
}

function coerce(out){
  let arr = out;
  if(typeof arr === 'string'){
    try{ arr = JSON.parse(arr.replace(/```json|```/g,'').trim()); }catch(e){ arr = [out]; }
  }
  if(arr && !Array.isArray(arr) && Array.isArray(arr.options)) arr = arr.options;
  if(!Array.isArray(arr)) return [];
  return arr.filter(x=>typeof x === 'string' && x.trim()).slice(0,3);
}

async function makeSentences(shorthand){
  const input = GUIDE + "\n\nShorthand: " + shorthand;
  const s = await getSample();
  if(s){
    return coerce(await s.json(input, {modelTier:'quick'}));
  }
  // chat preview path
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6", max_tokens:1000,
      messages:[{role:"user", content:input}]
    })
  });
  const data = await r.json();
  const text = (data.content||[]).map(b=>b.type==='text'?b.text:'').join('').trim();
  return coerce(text);
}

const optSheet = document.getElementById('optSheet');
let optSource = '';

async function openOptions(shorthand){
  optSource = shorthand;
  optSheet.classList.add('open');
  const list = document.getElementById('optList');
  const note = document.getElementById('optNote');
  list.innerHTML = '<div class="thinking">Working on it...</div>';
  note.textContent = '';
  try{
    const opts = await makeSentences(shorthand);
    if(!opts.length) throw new Error('none');
    list.innerHTML = '';
    opts.forEach(o=>{
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = o;
      b.onclick = ()=>{
        buffer = o; lastSaid = o;
        optSheet.classList.remove('open');
        renderSaid(); speak(o); bump(o);
      };
      list.appendChild(b);
    });
    note.textContent = 'Tap one to say it. It stays in the bar, so you can show it big or add it to the board.';
  }catch(e){
    list.innerHTML = '<div class="thinking">Could not reach Claude just now. Your words are still in the bar, and Say it works as is.</div>';
  }
}

document.getElementById('optCancel').onclick = ()=> optSheet.classList.remove('open');
document.getElementById('optAgain').onclick = ()=> openOptions(optSource);

// keep the category rail pinned right under the compose bar
function measure(){
  const h = document.getElementById('stage').offsetHeight;
  document.documentElement.style.setProperty('--stageH', h + 'px');
}
window.addEventListener('resize', measure);

/* ------------------------------------------------------------------ boot */
const fsBtn = document.getElementById('fsBtn');
const root = document.documentElement;
let framed = false; try{ framed = window.self !== window.top; }catch(e){ framed = true; }
if(framed || !(root.requestFullscreen || root.webkitRequestFullscreen)){
  fsBtn.style.display = 'none';
  if(fsBtn.nextElementSibling && fsBtn.nextElementSibling.classList.contains('tsep')) fsBtn.nextElementSibling.style.display = 'none';
}
fsBtn.onclick = ()=>{
  try{
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      fsBtn.textContent = 'Exit full screen';
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      fsBtn.textContent = 'Full screen';
    }
  }catch(e){}
};
const searchEl = document.getElementById('search');
if(searchEl){
  let t;
  searchEl.oninput = ()=>{ clearTimeout(t); t = setTimeout(renderGrid, 120); };
}

function applyTheme(){
  const t = (settings.theme || 'auto');
  const sysDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const dark = t === 'dark' || (t === 'auto' && sysDark);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const b = document.getElementById('themeBtn');
  if(b) b.textContent = dark ? 'Light theme' : 'Dark theme';
}
function updateStyleButton(){
  const classic = settings.uiStyle === 'classic';
  const b = document.getElementById('styleBtn');
  if(b){
    b.textContent = classic ? 'Nested style' : 'Old style';
    b.setAttribute('aria-pressed', classic ? 'true' : 'false');
  }
  const main = document.getElementById('styleSwitchMain');
  if(main){
    main.textContent = classic ? 'Switch to Nested Style' : 'Switch to Old Style';
    main.setAttribute('aria-pressed', classic ? 'true' : 'false');
  }
}
function toggleUiStyle(){
  settings.uiStyle = settings.uiStyle === 'classic' ? 'nested' : 'classic';
  activeSubtopic = {};
  radialPage = {};
  updateStyleButton();
  save();
  renderGrid();
}
document.getElementById('styleBtn').onclick = toggleUiStyle;
document.getElementById('styleSwitchMain').onclick = toggleUiStyle;

document.getElementById('themeBtn').onclick = ()=>{
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  settings.theme = isDark ? 'light' : 'dark';
  applyTheme(); save();
};
if(window.matchMedia){
  try{
    matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', ()=>{ if((settings.theme||'auto')==='auto') applyTheme(); });
  }catch(e){}
}


document.addEventListener('fullscreenchange', ()=>{
  fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
  measure();
});

(async function(){
  applyTheme(); updateStyleButton();
  renderSaid(); renderRail(); renderGrid(); measure();
  if(window.speechSynthesis) loadVoices();
  await initBackend();
  await load();
  applyTheme(); updateStyleButton();
  renderGrid(); renderSaid(); measure();
  if(window.speechSynthesis) loadVoices();
})();
</script>
