<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speechy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000;
    --ink-soft:#4B6070;
    --vista-blue:#003399;
    --line:#B8CFE0;
    --signal:#2B7CC4;
    --c-now:#1F5FA8;
    --c-people:#6A3D95;
    --c-work:#0E7B72;
    --c-church:#3F7A22;
    --c-around:#9A5B06;
    --c-recent:#A32C24;
    --c-joke:#B07206;
    --radius:3px;
    --font:"Segoe UI",Tahoma,"Atkinson Hyperlegible",ui-sans-serif,-apple-system,sans-serif;
    --gloss:linear-gradient(180deg,#FDFEFF 0%,#EFF6FC 49%,#DCEAF7 50%,#E9F3FC 100%);
    --glossblue:linear-gradient(180deg,#9FD6F7 0%,#5BAFE8 49%,#2277C4 50%,#3E95D6 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;
    overscroll-behavior:none;
    background:
      radial-gradient(1100px 460px at 14% 6%, rgba(150,235,255,.34), transparent 60%),
      radial-gradient(900px 600px at 86% 20%, rgba(120,255,214,.15), transparent 62%),
      radial-gradient(1200px 760px at 60% 98%, rgba(56,142,230,.45), transparent 66%),
      linear-gradient(168deg,#04101F 0%,#0A2648 44%,#071C36 74%,#030C18 100%);
    background-attachment:fixed;
  }
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  :focus-visible{outline:1px dotted #333;outline-offset:2px}

  .desktop{min-height:100%;display:flex;padding:0;position:relative}

  /* window states */
  body.state-min .window,body.state-closed .window{display:none}
  body.state-open .deskicons,body.state-open .taskbar{display:none}
  body.state-closed .taskbtn{display:none}

  .deskicons{position:absolute;top:calc(18px + env(safe-area-inset-top));left:16px;z-index:2}
  .deskicon{
    display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;padding:9px 4px;
    border:1px solid transparent;border-radius:3px;
  }
  .deskicon:hover{background:rgba(120,190,255,.28);border-color:rgba(160,215,255,.6)}
  .deskicon .ic{
    font-size:30px;width:52px;height:52px;line-height:52px;border-radius:7px;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(150,205,245,.35));
    border:1px solid rgba(255,255,255,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 6px rgba(0,0,0,.45);
  }
  .deskicon .lbl{
    font-size:12px;color:#fff;line-height:1.25;
    text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.8);
  }

  .taskbar{
    position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:7px;
    padding:4px 8px;padding-bottom:calc(4px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(28,58,92,.86) 0%,rgba(8,22,40,.92) 48%,
               rgba(4,14,28,.94) 52%,rgba(14,34,60,.9) 100%);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid rgba(150,205,245,.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  }
  .orb{
    width:40px;height:40px;border-radius:50%;flex:0 0 auto;
    background:
      radial-gradient(circle at 50% 24%,rgba(255,255,255,.95) 0%,rgba(190,235,255,.5) 26%,transparent 46%),
      radial-gradient(circle at 50% 60%,#3DA8E8 0%,#1B6BB0 55%,#0B3D72 100%);
    border:1px solid #0B3D72;
    box-shadow:0 0 12px rgba(110,200,255,.85),inset 0 -2px 6px rgba(0,0,0,.45);
  }
  .orb:hover{box-shadow:0 0 18px rgba(150,220,255,1),inset 0 -2px 6px rgba(0,0,0,.45)}
  .taskbtn{
    padding:8px 14px;border-radius:3px;font-size:13px;color:#EAF6FF;max-width:230px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    background:linear-gradient(180deg,rgba(140,195,240,.42) 0%,rgba(60,120,180,.32) 49%,
               rgba(30,80,135,.35) 50%,rgba(80,150,210,.35) 100%);
    border:1px solid rgba(160,215,255,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
    text-shadow:0 1px 2px rgba(0,0,0,.7);
  }
  .taskbtn:hover{filter:brightness(1.25)}
  .tray{
    margin-left:auto;font-size:12px;color:#DCEEFF;padding:0 8px;
    text-shadow:0 1px 2px rgba(0,0,0,.8);border-left:1px solid rgba(160,215,255,.3);
  }

  /* ================= the window ================= */
  .window{
    flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100%;
    background:#F0F6FB;overflow:hidden;
  }
  @media (min-width:900px){
    .desktop{padding:26px 20px 34px}
    .window{
      max-width:1240px;margin:0 auto;min-height:0;height:calc(100vh - 60px);
      border:1px solid rgba(255,255,255,.55);border-radius:9px 9px 5px 5px;
      box-shadow:0 0 0 1px rgba(0,40,80,.5),0 26px 60px rgba(0,0,0,.62),
                 inset 0 1px 0 rgba(255,255,255,.7);
    }
  }

  /* ---- glass title bar ---- */
  .titlebar{
    display:flex;align-items:center;gap:9px;padding:9px 8px 9px 13px;position:relative;
    background:linear-gradient(180deg,rgba(228,244,255,.58) 0%,rgba(166,206,238,.42) 48%,
               rgba(120,172,218,.40) 52%,rgba(178,216,245,.50) 100%);
    -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
    border-bottom:1px solid rgba(255,255,255,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85);
    padding-top:calc(9px + env(safe-area-inset-top));
  }
  .ticon{font-size:15px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
  .caption{
    font-size:14px;font-weight:600;color:#0B2440;
    text-shadow:0 0 7px rgba(255,255,255,.95),0 0 12px rgba(255,255,255,.85);
  }
  .caps{margin-left:auto;display:flex;gap:2px}
  .cap{
    width:29px;height:21px;border:1px solid rgba(255,255,255,.7);border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(255,255,255,.72) 0%,rgba(205,232,250,.5) 49%,
               rgba(140,190,230,.45) 50%,rgba(190,224,248,.55) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  }
  .cap i{display:block;background:#0B2440}
  .cap.min i{width:9px;height:2px;margin-top:6px}
  .cap.max i{width:10px;height:9px;background:none;border:2px solid #0B2440;border-top-width:3px}
  .cap.close{
    width:45px;
    background:linear-gradient(180deg,#FBBFA8 0%,#E8724C 49%,#C8331A 50%,#E05C36 100%);
    border-color:#9C2A14;
  }
  .cap.close i{
    width:11px;height:11px;background:none;position:relative;
  }
  .cap.close i::before,.cap.close i::after{
    content:"";position:absolute;left:0;top:4px;width:11px;height:2px;background:#fff;
    box-shadow:0 0 2px rgba(0,0,0,.5);
  }
  .cap.close i::before{transform:rotate(45deg)}
  .cap.close i::after{transform:rotate(-45deg)}
  .cap:hover{filter:brightness(1.12)}

  /* ---- address bar ---- */
  .navbar{
    display:flex;align-items:center;gap:6px;padding:7px 9px;
    background:linear-gradient(180deg,rgba(226,242,253,.55),rgba(186,216,240,.42));
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.4);
  }
  .navbtn{
    width:26px;height:26px;border-radius:50%;font-size:11px;color:#0B3E73;
    background:radial-gradient(circle at 50% 30%,#FFFFFF 0%,#D6EBFA 45%,#96C4E6 100%);
    border:1px solid #79A8CC;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(0,0,0,.3);
    display:flex;align-items:center;justify-content:center;
  }
  .navbtn:hover{background:radial-gradient(circle at 50% 30%,#FFFFFF 0%,#E8F6FF 45%,#7FC4F0 100%)}
  .address{
    flex:1;min-width:0;display:flex;align-items:center;gap:4px;overflow:hidden;
    height:26px;padding:0 8px;background:#fff;border:1px solid #7EA7C4;border-radius:2px;
    box-shadow:inset 0 1px 2px rgba(20,60,100,.22);font-size:13px;white-space:nowrap;
  }
  .crumb{color:#123B63}
  .crumb.here{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .sep{color:#6C93B3;font-size:9px}
  .searchbox{width:130px;flex:0 0 auto}
  .searchbox input{
    width:100%;height:26px;padding:0 8px;font-family:inherit;font-size:13px;
    background:#fff;border:1px solid #7EA7C4;border-radius:2px;color:#000;
    box-shadow:inset 0 1px 2px rgba(20,60,100,.22);
  }
  @media (max-width:560px){ .searchbox{width:86px} .address{font-size:12px} }

  /* ---- command bar ---- */
  .toolbar{
    display:flex;align-items:center;gap:2px;padding:4px 8px;
    background:linear-gradient(180deg,#F7FBFE 0%,#E4EFF8 48%,#D7E8F5 52%,#EAF4FC 100%);
    border-bottom:1px solid #A8C6DC;
  }
  .tbtn{
    padding:5px 11px;font-size:13px;color:#10314F;border:1px solid transparent;border-radius:3px;
  }
  .tbtn:hover{
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(206,232,250,.9));
    border-color:#9DC4E0;box-shadow:inset 0 1px 0 #fff;
  }
  .tbtn[aria-pressed="true"]{
    background:linear-gradient(180deg,#BFE0F6,#8FC4E8);border-color:#6FA3C8;
    box-shadow:inset 0 1px 3px rgba(20,60,100,.35);font-weight:600;
  }
  .tsep{width:1px;height:16px;background:#B4CDDF;margin:0 4px}

  /* ---- panes ---- */
  .frame{flex:1;display:flex;min-height:0;background:#fff}
  .navpane{display:none}
  @media (min-width:980px){
    .navpane{
      display:block;width:196px;flex:0 0 196px;overflow-y:auto;padding:12px 10px;
      background:linear-gradient(180deg,#EDF4FA,#E2EDF7);border-right:1px solid #C3D8E7;
    }
    .nphead{font-size:12px;color:#5A7994;font-weight:600;padding:0 6px 8px}
    .navitem{
      display:flex;align-items:center;gap:8px;width:100%;text-align:left;
      padding:7px 8px;border-radius:3px;font-size:13px;color:#123B63;border:1px solid transparent;
    }
    .navitem:hover{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(212,234,250,.9));border-color:#AFD0E8}
    .navitem[aria-selected="true"]{
      background:linear-gradient(180deg,#D6EAF9,#B7D8F0);border-color:#8FB9D8;font-weight:600;
    }
    .navitem .dot{width:9px;height:9px;border-radius:2px;background:var(--cat);flex:0 0 auto;
                  box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
    .rail{display:none !important}
  }
  .content{flex:1;min-width:0;overflow-y:auto;background:#fff;position:relative}

  /* ---- vista scrollbars ---- */
  .content::-webkit-scrollbar,.navpane::-webkit-scrollbar,.sheet-inner::-webkit-scrollbar{width:16px}
  .content::-webkit-scrollbar-track,.navpane::-webkit-scrollbar-track,.sheet-inner::-webkit-scrollbar-track{
    background:linear-gradient(90deg,#F2F7FB,#E6EFF6);border-left:1px solid #CBDCE9;
  }
  .content::-webkit-scrollbar-thumb,.navpane::-webkit-scrollbar-thumb,.sheet-inner::-webkit-scrollbar-thumb{
    border:1px solid #8FB4D0;border-radius:3px;
    background:linear-gradient(90deg,#FDFEFF,#D9EAF8 48%,#BBD9F0 52%,#DCEDFB);
  }

  /* ---- the speak panel ---- */
  .stage{padding:12px 12px 10px;position:sticky;top:0;z-index:20;
         background:linear-gradient(180deg,#FFFFFF 70%,rgba(255,255,255,.92))}
  .said{
    background:linear-gradient(180deg,#F8FCFF,#E9F3FB);
    border:1px solid #A9C9E0;border-radius:4px;padding:14px;
    box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(20,60,100,.18);
  }
  .said p{margin:0 0 12px;font-size:25px;line-height:1.22;font-weight:600;min-height:1.22em;word-break:break-word}
  .said p.empty{color:#7C93A6;font-weight:400;font-size:19px}
  .modebar{display:flex;gap:5px;margin-bottom:11px}
  .mode{
    flex:1;padding:7px 8px;border-radius:3px;font-size:13px;color:#10314F;
    background:var(--gloss);border:1px solid #A9C9E0;box-shadow:inset 0 1px 0 #fff;
  }
  .mode[aria-pressed="true"]{
    background:var(--glossblue);color:#fff;border-color:#1B6098;font-weight:600;
    text-shadow:0 1px 1px rgba(0,0,0,.45);
  }
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .actions.three{grid-template-columns:1.1fr 1.3fr .7fr}
  .act{
    padding:13px 9px;border-radius:3px;font-size:17px;font-weight:600;color:#fff;
    background:var(--glossblue);border:1px solid #1B6098;text-shadow:0 1px 1px rgba(0,0,0,.45);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 1px 2px rgba(0,0,0,.28);
  }
  .act:hover:not(:disabled){filter:brightness(1.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 9px rgba(120,200,250,.95),0 1px 2px rgba(0,0,0,.28)}
  .act.secondary{background:linear-gradient(180deg,#9AA8B6 0%,#64788C 49%,#3F5468 50%,#586E83 100%);border-color:#334758}
  .act.ghost{background:var(--gloss);color:#10314F;border-color:#A9C9E0;text-shadow:none}
  .act:disabled{opacity:.45}
  .act:active{transform:translateY(1px)}

  /* ---- tabs (mobile) ---- */
  .rail{display:flex;gap:3px;overflow-x:auto;padding:0 12px;scrollbar-width:none;
        position:sticky;top:var(--stageH,150px);z-index:19;background:#fff;
        border-bottom:1px solid #C3D8E7}
  .rail::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;padding:8px 13px;border-radius:3px 3px 0 0;font-size:13px;color:#1B3A57;
    flex:0 0 auto;background:linear-gradient(180deg,#F4F9FD,#DDEBF7);
    border:1px solid #BCD5E7;border-bottom:none;
  }
  .chip[aria-selected="true"]{
    background:#fff;color:var(--cat);font-weight:600;
    box-shadow:inset 0 2px 0 var(--cat);
  }

  /* ---- tiles ---- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
  .tile{
    background:var(--gloss);border:1px solid #A9C9E0;border-left:5px solid var(--cat);
    border-radius:var(--radius);padding:14px 13px;text-align:left;font-size:16px;font-weight:600;
    line-height:1.25;min-height:84px;display:flex;align-items:flex-start;position:relative;color:#10314F;
    box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(20,60,100,.16);
  }
  .tile:hover{background:linear-gradient(180deg,#FFFFFF 0%,#F2F9FF 49%,#DCEEFC 50%,#EDF7FF 100%);
              border-color:#7FB4DA;box-shadow:inset 0 1px 0 #fff,0 0 8px rgba(120,200,250,.75)}
  .tile:active{background:linear-gradient(180deg,#D3E7F7,#BCD9F0)}
  .tile.wide{grid-column:1 / -1;min-height:0;font-size:17px}
  .grid.compact{grid-template-columns:repeat(3,1fr);gap:7px}
  .grid.compact .tile{min-height:58px;font-size:15px;padding:9px 6px;
                      align-items:center;justify-content:center;text-align:center;border-left-width:4px}
  .tile .del{
    position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;
    background:linear-gradient(180deg,#FBBFA8 0%,#E8724C 49%,#C8331A 50%,#E05C36 100%);
    color:#fff;font-size:16px;font-weight:700;line-height:26px;text-align:center;
    border:1px solid #9C2A14;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.4);
  }
  .tile.random{
    grid-column:1 / -1;border-left:none;min-height:0;padding:13px;justify-content:center;
    text-align:center;font-size:17px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45);
    background:linear-gradient(180deg,#F8D89A 0%,#E0A93A 49%,#B47A08 50%,#D09A20 100%);
    border:1px solid #8A5D06;
  }
  .addtile{
    grid-column:1 / -1;padding:13px;border-radius:var(--radius);border:1px dashed #9FC2DC;
    font-size:14px;color:#3E6183;background:#F6FAFD;
  }
  .empty-note{grid-column:1 / -1;padding:26px 6px;color:#5A7994;font-size:15px}
  .addon-note{grid-column:1 / -1;color:#5A7994;font-size:13px;padding:2px 2px 6px}
  .group-head{
    grid-column:1 / -1;font-size:12px;font-weight:700;color:#5A7994;letter-spacing:.06em;
    text-transform:uppercase;padding:14px 2px 4px;border-bottom:1px solid #DCE9F3;margin-bottom:2px;
  }

  /* ---- command area + status bar ---- */
  .dock{
    display:flex;gap:7px;padding:8px 12px;
    background:linear-gradient(180deg,#F5FAFE,#E2EDF7);border-top:1px solid #B4CDDF;
  }
  .dock button{
    flex:1;padding:11px 8px;border-radius:3px;font-size:15px;font-weight:600;color:#10314F;
    background:var(--gloss);border:1px solid #A9C9E0;box-shadow:inset 0 1px 0 #fff;
  }
  .dock button:hover{border-color:#7FB4DA;box-shadow:inset 0 1px 0 #fff,0 0 8px rgba(120,200,250,.7)}
  .dock button.card{
    flex:0 0 auto;padding:11px 16px;color:#fff;background:var(--glossblue);
    border-color:#1B6098;text-shadow:0 1px 1px rgba(0,0,0,.45);
  }
  .details{
    padding:5px 12px;font-size:12px;color:#3E6183;
    background:linear-gradient(180deg,#EFF5FA,#DFEAF4);border-top:1px solid #C3D8E7;
    padding-bottom:calc(5px + env(safe-area-inset-bottom));
  }

  /* ---- overlays: readability first ---- */
  .overlay{position:fixed;inset:0;z-index:60;background:#FFFFFF;display:none;flex-direction:column;
           padding:22px;border-top:5px solid #2277C4}
  .overlay.open{display:flex}
  .overlay .fit{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}
  .overlay .fit span{font-weight:700;line-height:1.12;word-break:break-word;color:#00182E}
  .overlay .hint{text-align:center;color:#4A6E8F;font-size:15px;padding-top:10px}
  .card-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .card-body p{margin:0;font-size:27px;font-weight:600;line-height:1.3;color:#00182E}
  .card-body p.small{font-size:18px;font-weight:400;color:#4A6E8F}

  /* ---- task dialogs ---- */
  .sheet{position:fixed;inset:0;z-index:70;background:rgba(6,22,40,.45);display:none;
         align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .sheet-inner{
    width:100%;max-width:620px;padding:0;max-height:88vh;overflow:auto;background:#fff;
    border:1px solid #6E97B8;border-bottom:none;border-radius:6px 6px 0 0;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);
  }
  .sheet h2{
    margin:0;padding:16px 18px 4px;font-size:19px;font-weight:400;color:var(--vista-blue);
  }
  .sheet-inner > *:not(h2):not(.sheet-actions){margin-left:18px;margin-right:18px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:#10314F}
  textarea,select,input[type=text]{
    width:100%;font-family:inherit;font-size:16px;padding:8px;border-radius:2px;
    border:1px solid #7EA7C4;background:#fff;color:#000;
    box-shadow:inset 0 1px 2px rgba(20,60,100,.22);
  }
  textarea{min-height:90px;resize:vertical}
  input[type=range]{width:100%;accent-color:#2277C4}
  .sheet-actions{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 0;padding:12px 18px;
    background:linear-gradient(180deg,#F2F7FB,#E6EFF6);border-top:1px solid #C3D8E7;
  }
  .sheet-actions button{
    padding:10px;border-radius:3px;font-size:14px;color:#10314F;
    background:var(--gloss);border:1px solid #9DBFD8;box-shadow:inset 0 1px 0 #fff;
  }
  .sheet-actions button:hover{border-color:#6FA3C8;box-shadow:inset 0 1px 0 #fff,0 0 7px rgba(120,200,250,.8)}
  .sheet-actions button.primary{
    color:#fff;background:var(--glossblue);border-color:#1B6098;font-weight:600;
    text-shadow:0 1px 1px rgba(0,0,0,.4);
  }
  .note{font-size:12px;color:#5A7994;margin:10px 0 14px;line-height:1.45}
  .opt{
    display:block;width:100%;text-align:left;border-radius:var(--radius);padding:14px;
    font-size:17px;font-weight:600;line-height:1.3;margin-bottom:8px;color:#10314F;
    background:var(--gloss);border:1px solid #A9C9E0;border-left:5px solid var(--signal);

<div class="desktop">

  <div class="deskicons">
    <button class="deskicon" id="deskIcon">
      <span class="ic" aria-hidden="true">&#128483;</span>
      <span class="lbl">Speechy</span>
    </button>
  </div>

<div class="window" id="app">

  <div class="titlebar">
    <span class="ticon" aria-hidden="true">&#128483;</span>
    <span class="caption">Speechy</span>
    <div class="caps">
      <button class="cap min" id="minBtn" aria-label="Minimize"><i></i></button>
      <button class="cap max" id="maxBtn" aria-label="Maximize"><i></i></button>
      <button class="cap close" id="closeBtn" aria-label="Close"><i></i></button>
    </div>
  </div>

  <div class="navbar">
    <button class="navbtn" id="backBtn" aria-label="Back">&#9664;</button>
    <button class="navbtn" id="fwdBtn" aria-label="Forward">&#9654;</button>
    <div class="address">
      <span class="crumb">Lance</span><span class="sep">&#9654;</span><span class="crumb">Speechy</span><span class="sep">&#9654;</span><span class="crumb here" id="crumb">Right now</span>
    </div>
    <div class="searchbox">
      <input type="text" id="search" placeholder="Search" autocomplete="off" aria-label="Search all phrases">
    </div>
  </div>

  <div class="toolbar">
    <button class="tbtn" id="editBtn" aria-pressed="false">Organize</button>
    <span class="tsep"></span>
    <button class="tbtn" id="setBtn">Voice</button>
    <span class="tsep"></span>
    <button class="tbtn" id="fsBtn">Full screen</button>
    <span class="tsep"></span>
    <button class="tbtn" id="themeBtn">Dark theme</button>
  </div>

  <div class="frame">
    <div class="navpane">
      <div class="nphead">Favorite Links</div>
      <div id="navlist"></div>
    </div>

    <div class="content">
      <div class="stage" id="stage">
        <div class="said">
          <div class="modebar" role="group" aria-label="What tapping a tile does">
            <button id="modeSpeak" class="mode" aria-pressed="true">Tap speaks</button>
            <button id="modeBuild" class="mode" aria-pressed="false">Tap builds</button>
          </div>
          <p id="saidText" class="empty">Tap a phrase and it speaks.</p>
          <div class="actions" id="speakActions">
            <button class="act" id="sayAgain" disabled>Say again</button>
            <button class="act secondary" id="showBig" disabled>Show big</button>
          </div>
          <div class="actions three" id="buildActions" hidden>
            <button class="act" id="buildSay" disabled>Say it</button>
            <button class="act secondary" id="buildExpand" disabled>Make a sentence</button>
            <button class="act ghost" id="buildClear" disabled>Clear</button>
          </div>
        </div>
      </div>

      <div class="rail" id="rail" role="tablist"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="dock">
    <button id="typeBtn">Type something</button>
    <button class="card" id="cardBtn">Card</button>
  </div>

  <div class="details" id="details"></div>
</div>

  <div class="taskbar">
    <button class="orb" id="orbBtn" aria-label="Start"></button>
    <button class="taskbtn" id="taskBtn"><span aria-hidden="true">&#128483;</span> Speechy</button>
    <div class="tray"><span id="clock"></span></div>
  </div>
</div>

<!-- show-big overlay -->
<div class="overlay" id="bigOverlay" role="dialog" aria-label="Displayed message">
  <div class="fit"><span id="bigText"></span></div>
  <div class="hint">Tap anywhere to close</div>
</div>

<!-- explainer card overlay -->
<div class="overlay" id="cardOverlay" role="dialog" aria-label="Explainer card">
  <div class="card-body">
    <p id="cardText"></p>
    <p class="small">Tap anywhere to close. Hold Edit on the board to change this.</p>
  </div>
</div>

<!-- sentence options sheet -->
<div class="sheet" id="optSheet" role="dialog" aria-label="Sentence options">
  <div class="sheet-inner">
    <h2>Pick a sentence</h2>
    <div id="optList"></div>
    <div class="sheet-actions">
      <button id="optCancel">Back</button>
      <button class="primary" id="optAgain">Try again</button>
    </div>
    <p class="note" id="optNote"></p>
  </div>
</div>

<!-- type sheet -->
<div class="sheet" id="typeSheet" role="dialog" aria-label="Type a message">
  <div class="sheet-inner">
    <h2>Type a message</h2>
    <textarea id="typeInput" placeholder="Write what you want to say" autocomplete="off"></textarea>
    <div class="sheet-actions">
      <button id="typeCancel">Cancel</button>
      <button class="primary" id="typeSpeak">Say it</button>
    </div>
    <div class="sheet-actions" style="grid-template-columns:1fr 1fr;margin-top:8px">
      <button id="typeExpand">Make a sentence</button>
      <button id="typeShow">Show it big</button>
    </div>
  </div>
</div>

<!-- add phrase sheet -->
<div class="sheet" id="addSheet" role="dialog" aria-label="Add a phrase">
  <div class="sheet-inner">
    <h2 id="addTitle">Add a phrase</h2>
    <textarea id="addInput" placeholder="Write it out the way you'd say it, as a full sentence"></textarea>
    <div class="sheet-actions">
      <button id="addCancel">Cancel</button>
      <button class="primary" id="addSave">Save</button>
    </div>
  </div>
</div>

<!-- settings sheet -->
<div class="sheet" id="setSheet" role="dialog" aria-label="Voice settings">
  <div class="sheet-inner">
    <h2>Voice</h2>
    <label for="voiceSel">Which voice</label>
    <select id="voiceSel"></select>
    <label for="rate">Speed</label>
    <input type="range" id="rate" min="0.6" max="1.3" step="0.05">
    <label for="cardEdit">Card for handing to someone</label>
    <textarea id="cardEdit"></textarea>
    <div class="sheet-actions">
      <button id="setClose">Done</button>
      <button class="primary" id="setTest">Test the voice</button>
    </div>
    <p class="note" id="voiceNote"></p>
    <div class="sheet-actions" style="grid-template-columns:1fr;margin-top:10px">
      <button id="resetBtn">Reset board to the original phrases</button>
    </div>
  </div>
</div>

const CARD_OLD =
  "My speech is affected by an injury.\n\nI understand you completely — please talk to me normally, and give me a moment to answer.\n\nThank you.";
const CARD_DEFAULT =
  "My speech is affected by cerebral palsy.\n\nI understand you completely. Please talk to me normally, and give me a moment to answer.\n\nThank you.";
const RETIRED_PHRASES = ["I had a brain injury last year, and my speech is still coming back."];

let custom = {};      // {catId: [phrases]}
let removed = {};     // {catId: [phrases removed from BASE]}
let counts  = {};     // {phrase: n}
let settings = {rate:0.95, voiceURI:null, card:CARD_DEFAULT, theme:'auto'};
let activeCat = 'now';
let editing = false;
let lastSaid = '';
let buffer = '';
let mode = 'speak';
let addTarget = null;

/* ------------------------------------------------------------- storage */
/* Works in three places: a published page (claude db, syncs across your
   devices), the chat preview (window.storage), or a plain saved file
   (localStorage). Falls back to memory-only rather than breaking. */
let backend = 'memory', dbDoc = null;

async function initBackend(){
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      const db = await window.claude.use('db');
      if(db){ dbDoc = db.doc('board/main'); backend = 'db'; return; }
    }
  }catch(e){}
  if(window.storage && window.storage.get){ backend = 'storage'; return; }
  try{
    localStorage.setItem('aac:probe','1'); localStorage.removeItem('aac:probe');
    backend = 'local';
  }catch(e){ backend = 'memory'; }
}

function apply(raw){
  if(!raw) return;
  custom = raw.custom || {}; removed = raw.removed || {};
  counts = raw.counts || {}; settings = Object.assign(settings, raw.settings || {});
  // the saved card still carries the old "injury" wording unless he edited it himself
  let changed = false;
  if(settings.card === CARD_OLD){ settings.card = CARD_DEFAULT; changed = true; }
  RETIRED_PHRASES.forEach(p=>{ if(counts[p] !== undefined){ delete counts[p]; changed = true; } });
  if(changed) save();
}

async function load(){
  try{
    if(backend === 'db'){
      const snap = await dbDoc.get();
      if(snap.exists) apply(snap.data());
    } else if(backend === 'storage'){
      const r = await window.storage.get('aac:board');
      if(r && r.value) apply(JSON.parse(r.value));
    } else if(backend === 'local'){
      const v = localStorage.getItem('aac:board');
      if(v) apply(JSON.parse(v));
    }
  }catch(e){ /* nothing saved yet, or storage unavailable — defaults stand */ }
}

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const payload = {custom, removed, counts, settings};
    try{
      if(backend === 'db') await dbDoc.set(payload);
      else if(backend === 'storage') await window.storage.set('aac:board', JSON.stringify(payload));
      else if(backend === 'local') localStorage.setItem('aac:board', JSON.stringify(payload));
    }catch(e){ console.error('Could not save', e); }
  }, 300);
}

/* --------------------------------------------------------------- speech */
let voices = [];
function loadVoices(){
  if(!window.speechSynthesis) return;
  voices = speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
  const sel = document.getElementById('voiceSel');
  sel.innerHTML = '';
  if(!voices.length){
    sel.innerHTML = '<option>Device default</option>';
  } else {
    voices.forEach(v=>{
      const o = document.createElement('option');
      o.value = v.voiceURI; o.textContent = v.name;
      if(v.voiceURI === settings.voiceURI) o.selected = true;
      sel.appendChild(o);
    });
  }
  document.getElementById('voiceNote').textContent = window.speechSynthesis
    ? 'If the room is loud, Show big works better than the voice.'
    : 'This device will not play a voice. Show big and the card still work.';
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text){
  if(!text) return;
  lastSaid = text;
  renderSaid();
  if(!window.speechSynthesis){ showBig(text); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = settings.rate;
    const v = voices.find(v=>v.voiceURI===settings.voiceURI);
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){ showBig(text); }
}

function bump(p){ counts[p] = (counts[p]||0)+1; save(); }

/* ---------------------------------------------------------------- render */
function phrasesFor(cat){
  if(cat === 'recent'){
    return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,12);
  }
  const gone = removed[cat] || [];
  if(cat === 'offduty'){
    return JOKE_GROUPS.flatMap(g=>g.lines).filter(p=>!gone.includes(p)).concat(custom.offduty || []);
  }
  return (BASE[cat]||[]).filter(p=>!gone.includes(p)).concat(custom[cat]||[]);
}

function renderSaid(){
  const el = document.getElementById('saidText');
  const build = mode === 'build';
  document.getElementById('speakActions').hidden = build;
  document.getElementById('buildActions').hidden = !build;
  document.getElementById('modeSpeak').setAttribute('aria-pressed', !build);
  document.getElementById('modeBuild').setAttribute('aria-pressed', build);

  const text = build ? buffer : lastSaid;
  if(text){ el.textContent = text; el.classList.remove('empty'); }
  else {
    el.textContent = build
      ? 'Tap words and phrases. They collect here.'
      : 'Tap a phrase and it speaks.';
    el.classList.add('empty');
  }
  document.getElementById('sayAgain').disabled = !lastSaid;
  document.getElementById('showBig').disabled  = !lastSaid;
  document.getElementById('buildSay').disabled    = !buffer;
  document.getElementById('buildExpand').disabled = !buffer;
  document.getElementById('buildClear').disabled  = !buffer;
  measure();
}

function addToBuffer(fragment, isAddon){
  const f = fragment.trim();
  if(!buffer){
    buffer = isAddon ? f.charAt(0).toUpperCase() + f.slice(1) : f;
    renderSaid();
    return;
  }
  if(isAddon){
    // attach to the end of what's there: "I'll have it to you." + "before Friday."
    // becomes "I'll have it to you before Friday."
    const ended = (buffer.match(/([.?!])\s*$/) || [])[1] || '';
    let joined = buffer.replace(/[.?!]\s*$/, '') + ' ' + f;
    if(ended === '?' && /\.$/.test(joined)) joined = joined.replace(/\.$/, '?');
    buffer = joined;
  } else if(/[.?!]\s*$/.test(buffer)){
    // two complete sentences stay two sentences
    buffer = buffer.replace(/\s*$/, '') + ' ' + f;
  } else {
    buffer = buffer + ' ' + f;
  }
  renderSaid();
}

function selectCat(c){
  activeCat = c.id;
  if(c.addon){
    if(mode !== 'build') mode = 'build';
    if(!buffer && lastSaid) buffer = lastSaid;
  }
  const q = document.getElementById('search');
  if(q) q.value = '';
  renderRail(); renderGrid(); renderSaid();
}

function renderRail(){
  const rail = document.getElementById('rail');
  const nav  = document.getElementById('navlist');
  rail.innerHTML = ''; if(nav) nav.innerHTML = '';
  CATS.forEach(c=>{
    if(nav){
      const n = document.createElement('button');
      n.className = 'navitem';
      n.setAttribute('aria-selected', c.id===activeCat);
      n.style.setProperty('--cat', c.color);
      const d = document.createElement('span'); d.className='dot';
      n.appendChild(d);
      n.appendChild(document.createTextNode(c.name));
      n.onclick = ()=> selectCat(c);
      nav.appendChild(n);
    }
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = c.name; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', c.id===activeCat);
    b.style.setProperty('--cat', c.color);
    b.onclick = ()=>{
      activeCat = c.id;
      if(c.addon){
        if(mode !== 'build') mode = 'build';
        if(!buffer && lastSaid) buffer = lastSaid;
      }
      renderRail(); renderGrid(); renderSaid();
    };
    rail.appendChild(b);
  });
}

function makeTile(p, cat, noDel){
  const t = document.createElement('button');
  t.className = 'tile' + (!cat.compact && p.length > 62 ? ' wide' : '');
  t.style.setProperty('--cat', cat.color);
  t.textContent = p;
  t.onclick = ()=>{
    if(editing) return;
    if(mode === 'build'){ addToBuffer(p, !!cat.addon); }
    else { speak(p); bump(p); }
  };
  if(editing && activeCat !== 'recent' && !noDel){
    const x = document.createElement('span');
    x.className='del'; x.textContent='×'; x.setAttribute('aria-label','Remove phrase');
    x.onclick = (e)=>{ e.stopPropagation(); removePhrase(activeCat, p); };
    t.appendChild(x);
  }
  return t;
}

function renderJokes(grid, cat){
  const warn = document.createElement('div');
  warn.className = 'addon-note';
  warn.textContent = 'Not for hearings. Probably not for church either.';
  grid.appendChild(warn);

  const rnd = document.createElement('button');
  rnd.className = 'tile random';
  rnd.textContent = 'Say a random one';
  rnd.onclick = ()=>{
    if(editing) return;
    const all = phrasesFor('offduty');
    if(!all.length) return;
    const p = all[Math.floor(Math.random()*all.length)];
    if(mode === 'build'){ addToBuffer(p, false); } else { speak(p); bump(p); }
  };
  grid.appendChild(rnd);

  const gone = removed.offduty || [];
  const groups = JOKE_GROUPS
    .map(g=>({name:g.name, lines:g.lines.filter(l=>!gone.includes(l))}))
    .filter(g=>g.lines.length);
  const mine = (custom.offduty || []).filter(Boolean);
  if(mine.length) groups.push({name:'Yours', lines:mine});

  groups.forEach(g=>{
    const h = document.createElement('div');
    h.className = 'group-head'; h.textContent = g.name;
    grid.appendChild(h);
    g.lines.forEach(p=> grid.appendChild(makeTile(p, cat)));
  });
}

function searchAll(q){
  const needle = q.toLowerCase();
  const out = [];
  CATS.forEach(c=>{
    if(c.id === 'recent') return;
    phrasesFor(c.id).forEach(p=>{
      if(p.toLowerCase().includes(needle)) out.push({p:p, cat:c});
    });
  });
  return out;
}

function setStatus(n, what){
  const d = document.getElementById('details');
  if(d) d.textContent = n + ' ' + (n === 1 ? 'item' : 'items') + (what ? '  |  ' + what : '');
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const cat = CATS.find(c=>c.id===activeCat);
  const crumb = document.getElementById('crumb');
  const sq = document.getElementById('search');
  const query = sq ? sq.value.trim() : '';
  grid.innerHTML = '';

  if(query){
    grid.className = 'grid';
    const hits = searchAll(query);
    if(crumb) crumb.textContent = 'Search Results';
    if(!hits.length){
      const d = document.createElement('div');
      d.className = 'empty-note';
      d.textContent = 'No phrases match that search.';
      grid.appendChild(d);
    }
    hits.forEach(h=> grid.appendChild(makeTile(h.p, h.cat, true)));
    setStatus(hits.length, 'matching "' + query + '"');
    return;
  }

  grid.className = 'grid' + (cat.compact ? ' compact' : '');
  grid.style.setProperty('--cat', cat.color);
  if(crumb) crumb.textContent = cat.name;
  const list = phrasesFor(activeCat);
  setStatus(list.length, cat.name);

  if(cat.addon){
    const n = document.createElement('div');
    n.className = 'addon-note';
    n.textContent = 'These attach to the end of the sentence in the bar above.';
    grid.appendChild(n);
  }

  if(cat.jokes){
    renderJokes(grid, cat);
  } else {
    if(!list.length){
      const d = document.createElement('div');
      d.className = 'empty-note';
      d.textContent = activeCat==='recent'
        ? 'Phrases you use will collect here, most-used first.'
        : 'Nothing here yet. Add a phrase below.';
      grid.appendChild(d);
    }
    list.forEach(p=> grid.appendChild(makeTile(p, cat)));
  }

  if(editing && activeCat!=='recent'){
    const a = document.createElement('button');
    a.className='addtile'; a.textContent='+ Add a phrase to ' + cat.name;
    a.onclick = ()=>openAdd(activeCat);
    grid.appendChild(a);
  }
}

function removePhrase(cat, p){
  if((custom[cat]||[]).includes(p)) custom[cat] = custom[cat].filter(x=>x!==p);
  else { removed[cat] = (removed[cat]||[]).concat([p]); }
  save(); renderGrid();
}

/* ------------------------------------------------------------- overlays */
function fitText(spanId, containerId, text){
  const span = document.getElementById(spanId);
  const box  = document.getElementById(containerId);
  span.textContent = text;
  const w = box.clientWidth || window.innerWidth;
  const h = box.clientHeight || window.innerHeight * 0.7;
  const len = Math.max(text.length, 4);
  let size = Math.sqrt((w*h*0.40)/len);
  size = Math.max(26, Math.min(150, size));
  span.style.fontSize = size + 'px';
}
function showBig(text){
  const o = document.getElementById('bigOverlay');
  o.classList.add('open');
  requestAnimationFrame(()=>fitText('bigText','bigOverlay',text));
}
document.getElementById('bigOverlay').onclick = e => e.currentTarget.classList.remove('open');
document.getElementById('cardOverlay').onclick = e => e.currentTarget.classList.remove('open');

/* ------------------------------------------------- sentence expansion */
const GUIDE =
  "You help a man named Lance speak. He is an attorney in Omaha; he has cerebral " +
  "palsy, which affects his speech, so he taps shorthand into a communication board and " +
  "you turn it into the full sentence he means to say out loud.\n" +
  "Rules: write in his first person. Natural spoken English, the way a capable " +
  "professional adult talks. Warm and direct, never flowery, never childlike, never " +
  "apologetic on his behalf. Keep it to what he actually indicated: do not invent " +
  "names, times, facts, or reasons he did not give. If the shorthand is already a " +
  "fine sentence, tighten it rather than padding it. No em dashes.\n" +
  "Give three versions: one plain and complete, one shorter and blunter, one more " +
  "formal for work or a hearing.\n" +
  "Return ONLY a JSON array of three strings, no other text.";

let sampleNS;
async function getSample(){
  if(sampleNS !== undefined) return sampleNS;
  sampleNS = null;
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      sampleNS = await window.claude.use('sample');
    }
  }catch(e){ sampleNS = null; }
  return sampleNS;
}

function coerce(out){
  let arr = out;
  if(typeof arr === 'string'){
    try{ arr = JSON.parse(arr.replace(/```json|```/g,'').trim()); }catch(e){ arr = [out]; }
  }
  if(arr && !Array.isArray(arr) && Array.isArray(arr.options)) arr = arr.options;
  if(!Array.isArray(arr)) return [];
  return arr.filter(x=>typeof x === 'string' && x.trim()).slice(0,3);
}

async function makeSentences(shorthand){
  const input = GUIDE + "\n\nShorthand: " + shorthand;
  const s = await getSample();
  if(s){
    return coerce(await s.json(input, {modelTier:'quick'}));
  }
  // chat preview path
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6", max_tokens:1000,
      messages:[{role:"user", content:input}]
    })
  });
  const data = await r.json();
  const text = (data.content||[]).map(b=>b.type==='text'?b.text:'').join('').trim();
  return coerce(text);
}

  list.innerHTML = '<div class="thinking">Working on it...</div>';
  note.textContent = '';
  try{
    const opts = await makeSentences(shorthand);
    if(!opts.length) throw new Error('none');
    list.innerHTML = '';
    opts.forEach(o=>{
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = o;
      b.onclick = ()=>{
        buffer = o; lastSaid = o;
        optSheet.classList.remove('open');

      };
      list.appendChild(b);
    });
    note.textContent = 'Tap one to say it. It stays in the bar, so you can show it big or add it to the board.';
  }catch(e){
    list.innerHTML = '<div class="thinking">Could not reach Claude just now. Your words are still in the bar, and Say it works as is.</div>';
  }
}

  let t;
  searchEl.oninput = ()=>{ clearTimeout(t); t = setTimeout(renderGrid, 120); };
}

// caption buttons: maximize does the real thing, the other two are 2007 set dressing
function applyTheme(){
  const t = (settings.theme || 'auto');
  const sysDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const dark = t === 'dark' || (t === 'auto' && sysDark);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const b = document.getElementById('themeBtn');
  if(b) b.textContent = dark ? 'Light theme' : 'Dark theme';
}
document.getElementById('themeBtn').onclick = ()=>{
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  settings.theme = isDark ? 'light' : 'dark';
  applyTheme(); save();
};
if(window.matchMedia){
  try{
    matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', ()=>{ if((settings.theme||'auto')==='auto') applyTheme(); });
  }catch(e){}
}

function setWindowState(st){
  document.body.className = 'state-' + st;
  if(st === 'open'){ measure(); }
  else if(window.speechSynthesis){ try{ speechSynthesis.cancel(); }catch(e){} }
}
setWindowState('open');

document.getElementById('maxBtn').onclick = ()=> fsBtn.click();
document.getElementById('minBtn').onclick = ()=> setWindowState('min');
document.getElementById('closeBtn').onclick = ()=>{
  setWindowState('closed');
  // a browser tab can only be script-closed if a script opened it; if this page
  // was launched that way, honour it, otherwise the desktop below is the close
  try{ window.close(); }catch(e){}
};
document.getElementById('deskIcon').onclick = ()=> setWindowState('open');
document.getElementById('taskBtn').onclick = ()=> setWindowState('open');
document.getElementById('orbBtn').onclick = ()=> setWindowState('open');

function tickClock(){
  const el = document.getElementById('clock');
  if(!el) return;
  el.textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
tickClock(); setInterval(tickClock, 20000);
document.getElementById('backBtn').onclick = ()=>{
  const i = CATS.findIndex(c=>c.id===activeCat);
  selectCat(CATS[(i - 1 + CATS.length) % CATS.length]);
};
document.getElementById('fwdBtn').onclick = ()=>{
  const i = CATS.findIndex(c=>c.id===activeCat);
  selectCat(CATS[(i + 1) % CATS.length]);
};

document.addEventListener('fullscreenchange', ()=>{
  fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
  measure();
});

(async function(){
  applyTheme();
  renderSaid(); renderRail(); renderGrid(); measure();
  if(window.speechSynthesis) loadVoices();
  await initBackend();
  await load();
  applyTheme();
  renderGrid(); renderSaid(); measure();
  if(window.speechSynthesis) loadVoices();
})();
</script>
